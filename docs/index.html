<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#254d3d" />
    <meta
      name="description"
      content="A calmer home, one small act of care at a time."
    />
    <title>Home Rhythm</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#home"
          ><span class="brand-mark">⌂</span
          ><span>home rhythm<small>A LITTLE CARE, EVERY DAY</small></span></a
        >
        <nav aria-label="Main navigation">
          <button data-nav="home"><span>⌂</span>Home</button
          ><button data-nav="tasks"><span>✓</span>Tasks</button
          ><button data-nav="house"><span>▦</span>House</button
          ><button data-nav="rhythm"><span>◷</span>Rhythm</button
          ><button data-nav="calendar"><span>▤</span>Calendar</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="household-avatar">S + B</div>
          <strong id="household-label">Our home</strong
          ><button data-nav="settings">Household settings</button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span class="topbar-brand">home rhythm</span
          ><span class="sync"
            ><i></i><span id="sync-label">Connecting</span></span
          ><span class="app-version" aria-label="App version 1.2.1">v1.2.1</span
          ><button
            data-nav="settings"
            aria-label="Household settings"
            class="avatar"
          >
            ⌂
          </button>
        </header>
        <div id="notice" role="alert" hidden></div>
        <main id="content" tabindex="-1"></main>
        <footer class="page-footer">
          A home that feels good. A rhythm that feels yours.
        </footer>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <header>
        <h2 id="dialog-title"></h2>
        <button
          data-action="close"
          class="icon-button"
          aria-label="Close dialog"
        >
          ×
        </button>
      </header>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>Home Rhythm needs JavaScript to manage your household.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
